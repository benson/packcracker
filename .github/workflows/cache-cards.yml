name: Cache Card Data

on:
  schedule:
    # Run after homepage publishes MTGJSON-derived shared artifacts.
    - cron: '20 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Cache mode'
        required: false
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
      sets:
        description: 'Optional comma-separated set codes to refresh'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CACHE_ACTIVE_RELEASE_DAYS: '120'
  CACHE_UPCOMING_DAYS: '90'
  CACHE_STALE_HOURS: '20'
  CACHE_MAX_TARGETS: '25'

concurrency:
  group: packcracker-cache-cards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache MTGJSON-backed card data
        # Reads MTGJSON-derived set/booster artifacts from bensonperry.com/shared.
        # Scryfall is used only for prices and card images.
        env:
          CACHE_MODE: ${{ github.event.inputs.mode || 'incremental' }}
          CACHE_SETS: ${{ github.event.inputs.sets || '' }}
        run: node scripts/cache-cards.js --mode "$CACHE_MODE" --sets "$CACHE_SETS"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update card cache $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
