name: Cache Card Data

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache card data from Scryfall
        # Reads the set list from bensonperry.com/shared/sets.json (built by homepage's
        # update-sets workflow). One source of truth, no drift, no local blacklist.
        run: node scripts/cache-cards.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update card cache $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
